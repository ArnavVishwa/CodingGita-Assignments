<body>
    <p>Use &amp;lt; for the less-than symbol.</p>
    <p>Code: if (x &amp;lt; 10) { ... }</p>
    <p>Hex: if (x &amp;#x3C; 10) { ... }</p>
    <br>
    <p>The greater-than symbol is &amp;gt;.</p>
    <p>Example: x &amp;gt; y</p>
    <p>Hex: x &amp;#x3E; y</p>
    <br>
    <p>Use &amp;amp; for the ampersand.</p>
    <p>Brand: Smith &amp; Co.</p>
    <p>Hex: Smith &amp;#x26; Co.</p>
</body>
